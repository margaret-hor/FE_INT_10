<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHROMAON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Aleo:wght@100..900&family=Josefin+Sans:wght@100..700&display=swap"
    rel="stylesheet">

   <script src="https://kit.fontawesome.com/8b7e845f0d.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="./styles/scss/css/main.css">
</head>

<body>
  <div class="page_wrapper">
    <section class="hero">
      <div class="hero_content">
        <div class="hero_logo_wrapper">
          <h1 class="logo main_logo">bhromaon</h1>
          <span class="slogan">safe travel anywhere</span>
        </div>
        <form action="#" class="hero_form">
          <div class="hero_search">
            <input type="search" name="search" id="search" class="search_input" placeholder="Search Your Travel Destination">
            <button type="submit" class="button hero_search_btn"> 
              <span>search</span>
              <svg viewBox="0 0 22 24" width="22" height="24" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                <circle cx="9" cy="10" class="search_circle hero_search_circle" />
                <polygon points="14,15 15,14 18,19 19,18" class="search_rect hero_search_rect" />
              </svg>
            </button>
          </div>
        </form>
      </div>
      <div class="hero_scroll_wrapper">
        <span class="hero_scroll_text">scroll down</span>
        <svg viewBox="0 0 16 8" width="16" height="8" class="scroll_arrow_wrapper" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
          <polyline points="0,0 8,8 16,0" class="scroll_arrow" />
        </svg>
      </div>
    </section>
    <header class="top_header">
      <div class="container top_navbar">
        <a href="#"><span class="logo">bhromaon</span></a>
        <nav class="top_nav">
          <ul class="nav_list">
            <li><a href="#">who we are</a></li>
            <li><a href="#">what we do</a></li>
            <li><a href="#">travel with us</a></li>
            <li><a href="#">contact us</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="intro">
      <div class="container intro_content_wrapper">
        <div class="intro_content"></div>
        <div class="intro_imgs"></div>
      </div>
    </section>
  </div>
</body>

</html>
