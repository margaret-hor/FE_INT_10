<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
  <script src="https://kit.fontawesome.com/8b7e845f0d.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./styles/scss/css/main.css">
</head>

<body>
  <div class="page_wrapper">
    <header class="top_menu">
      <div class="container menu">
        <div class="logo_wrapper">
          <img src="./assets/icons/Logo.svg" alt="Genesis">
        </div>
        <div class="nav_links">
          <span>Projects</span>
          <span>Contact</span>
        </div>
      </div>
    </header>
    <main>
      <section class="welcome">
        <div class="container flex-between">
          <div class="welcome_content">
            <h3 class="welcome_subheading">Shooting Stars</h3>
            <h2 class="welcome_heading">Hello, I’m Bakhtiyar Sattarov,
              <span>product designer</span> with experience
              in studios and startups
            </h2>
          </div>
          <div class="welcome_quote">
            <div class="quote_divider"></div>
            <p class="quote">Design is about progress</p>
          </div>
        </div>
      </section>
      <section class="works">
        <div class="container">
          <div class="works_grid">
            <div class="work mid_work">
              <img src="./assets/img/works/abstract_lady.jpg" alt="">
            </div>
            <div class="work small_work">
              <img src="./assets/img/works/brain-blow_guy.jpg" alt="">
            </div>
            <div class="work extra-large_work">
              <img src="./assets/img/works/flower_face.jpg" alt="">
            </div>
            <div class="work big_work">
              <img src="./assets/img/works/balloon_cacti.jpg" alt="">
            </div>
            <div class="work mid_work">
              <img src="./assets/img/works/liberty_statue.jpg" alt="">
            </div>
            <div class="work mid_work">
              <img src="./assets/img/works/glitter_face.jpg" alt="">
            </div>
            <div class="work big_work">
              <img src="./assets/img/works/ghost.jpg" alt="">
            </div>
            <div class="work large_work">
              <img src="./assets/img/works/sky_road.jpg" alt="">
            </div>
            <div class="work large_work">
              <img src="./assets/img/works/piano_swing.jpg" alt="">
            </div>
            <div class="work large_work">
              <img src="./assets/img/works/sunset_sunflower.jpg" alt="">
            </div>
            <div class="work extra-large_work">
              <img src="./assets/img/works/sunset_desert.jpg" alt="">
            </div>
            <div class="work small_work">
              <img src="./assets/img/works/turned_island.jpg" alt="">
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="bottom_menu">
      <div class="container menu">
        <div class="logo_wrapper">
          <img src="./assets/icons/Logo.svg" alt="Genesis">
        </div>
        <div class="menu_actions">
          <div class="nav_links">
            <span>Projects</span>
            <span>Contact</span>
          </div>
          <div class="social">
            <span class="social_icon"><i class="fa-brands fa-dribbble"></i></span>
            <span class="social_icon"><i class="fa-brands fa-instagram"></i></span>
            <span class="social_icon"><i class="fa-brands fa-twitter"></i></span>
          </div>
        </div>
      </div>
    </footer>
  </div>
</body>

</html>
