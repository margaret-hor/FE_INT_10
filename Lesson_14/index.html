<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG</title>
  <link rel="stylesheet" href="./style/css/main.css">
</head>

<body>
  <div class="page_wrapper">
    <div class="container flex-between svg_imgs">
      <svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
        <rect class="credit-card_bg" width="400" height="290" rx="20" ry="20" />
        <rect class="magnetic_stripe" x="0" y="35" width="400" height="57" />

        <g class="card-nums">
          <rect class="card-number-line" x="35" y="125" width="75" />
          <rect class="card-number-line" x="125" y="125" width="75" />
          <rect class="card-number-line cnuml-small" x="35" y="160" />
          <rect class="card-number-line cnuml-small" x="70" y="160" />
          <rect class="card-number-line cnuml-small" x="110" y="160" />
          <rect class="card-number-line cnuml-small" x="145" y="160" />
          <rect class="card-number-line cnuml-small" x="190" y="160" />
        </g>

        <circle cx="275" cy="215" r="41" fill="#DB2215" />
        <circle cx="320" cy="215" r="41" fill="#245EA9" />
      </svg>
      <svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
        <polygon points="20,120 120,210 190,35 265,210 380,120 310,310 75,310" class="crown" />
        <rect x="68" y="345" class="crown_under" />
      </svg>
      <svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
        <circle class="face-emoji" />
        <rect x="70" y="135" class="eye-closed"/>
        <rect x="240" y="135" class="eye-closed"/>
        <rect x="105" y="285" width="190" class="mouth-closed" />
      </svg>
      <svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
        <circle class="face-emoji" />
        <circle cy="127.5" cx="119.5" class="eye-opened"/>
        <circle cy="127.5" cx="272.5" class="eye-opened"/>
        <rect x="87" y="265" width="225" class="mouth-closed" />
      </svg>
      <svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
        <rect />
      </svg>
    </div>
  </div>
</body>

</html>
