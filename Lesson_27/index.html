<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events</title>

  <style>
    .page_wrapper {
      background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(255, 20, 147, 0.3);
      max-width: 600px;
      margin: 40px auto;
    }

    ul {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin: 15px 0;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      background: #fff;
      color: #ff1493;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 20, 147, 0.2);
    }

    a:hover {
      background: #ff1493;
      color: #fff;
      border: 1px solid #fff;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="page_wrapper">
    <ul>
      <li><a href="./Task 1/index.html">Task 1</a></li>
      <li><a href="./Task 2/index.html">Task 2</a></li>
      <li><a href="./Task 3/index.html">Task 3</a></li>
    </ul>
  </div>
</body>

</html>
