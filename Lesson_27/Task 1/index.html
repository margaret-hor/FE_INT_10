<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotkey Text Editor</title>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <div class="page_wrapper">
    <header>
      <h2 class="title">Welcome to my Hotkey Text Editor!</h2>
      <p class="subtitle">Edit text using Ctrl+E and save with Ctrl+S</p>
    </header>
    <div class="editor">
      <div class="text" id="text">
        This is an example text. You can edit this text by pressing <span>Ctrl+E</span> and save it with
        <span>Ctrl+S</span>.
      </div>
      <textarea class="text-area hidden" id="text-area">This is an example text. You can edit this text by pressing Ctrl+E and save it with Ctrl+S.</textarea>
    </div>
  </div>

  <script src="./main.js"></script>
</body>

</html>
