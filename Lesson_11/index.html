<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400..900&family=Potta+One&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/8b7e845f0d.js" crossorigin="anonymous"></script>
  
  <link rel="stylesheet" href="styles/scss/css/main.css">
</head>

<body>
  <div class="page_wrapper">
    <main>
      <section class="bd_card">
        <div class="container">
          <div class="bd_card_content">
            <div class="bd_card_text">
              <h2 class="bd_card_title heading">happy birthday</h2>
              <span class="bd_card_subtitle subheading"><span class="bd_card_emoji">&#129395</span>make a wish!<span class="bd_card_emoji">&#129395</span></span>
            </div>
            <div class="cake">
              <div class="candles">
                <div class="candle"><div class="flame"></div></div>
                <div class="candle"><div class="flame"></div></div>
                <div class="candle"><div class="flame"></div></div>
                <div class="candle"><div class="flame"></div></div>
                <div class="candle"><div class="flame"></div></div>
              </div>
              <div class="cake_layers">
                <div class="cake_layer"></div>
                <div class="cake_layer"></div>
              </div>
              <div class="cake_biscuit"></div>
            </div>
            <!--in progress, pls dont judge-->
            <!-- <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div> -->
          </div>
        </div>
      </section>
      <div class="support">
        <button class="support_btn"><i class="fa-solid fa-phone-volume support_btn_icon"></i></button>
      </div>
    </main>
  </div>
</body>

</html>
