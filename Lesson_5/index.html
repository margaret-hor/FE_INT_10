<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast</title>
  <link rel="stylesheet" href="../normalize.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page_wrapper">
    <div class="main_wrapper">
      <header class="main_header">
        <h1>CSS Weather Forecast</h1>
        <img src="./icons/half_sunny_icon.svg" alt="" aria-hidden="true">
      </header>
      <div class="forecast_wrapper">
        <div class="item w-50 lisbon">
          <div class="city_name">Lisbon</div>
          <div class="degs">21&deg;C <img src="./icons/sunny_weather_icon.svg" alt="Sunny Weather"></div>
        </div>
        <div class="item paris">
          <div class="city_name">Paris</div>
          <div class="degs">11&deg;C <img src="./icons/rainy_weather_icon.svg" alt="Rainy Weather"></div>
        </div>
        <div class="item belgrade">
          <div class="city_name">Belgrade</div>
          <div class="degs">15&deg;C <img src="./icons/cloud_sun2_icon.svg" alt="Cloudy Weather"></div>
        </div>
        <div class="item venice">
          <div class="city_name">Venice</div>
          <div class="degs">21&deg;C <img src="./icons/cloud_sun2_below_icon.svg" alt="Cloudy Weather"></div>
          <img src="./icons/cursor.png" alt="" aria-hidden="true" class="cursor_icon">
        </div>
        <div class="item tel-avive">
          <div class="city_name">Tel-Avive</div>
          <div class="degs">32&deg;C <img src="./icons/sun_melt_icon.svg" alt="Heat wave"></div>
        </div>
        <div class="item cairo">
          <div class="city_name">Cairo</div>
          <div class="degs">21&deg;C <img src="./icons/sunny_weather_icon.svg" alt="Sunny Weather"></div>
        </div>
        <div class="item new-york">
          <div class="city_name">New-York</div>
          <div class="degs">17&deg;C <img src="./icons/stormy_weather_icon.svg" alt="Stormy Weather"></div>
        </div>
        <div class="item new-delhi">
          <div class="city_name">New-Delhi</div>
          <div class="degs">17&deg;C <img src="./icons/straight_rain_icon.svg" alt="Rainy Weather"></div>
        </div>
        <div class="item w-50 san-francisco">
          <div class="city_name">San-Francisco</div>
          <div class="degs">15&deg;C <img src="./icons/cloud_sun3_icon.svg" alt="Cloudy Weather"></div>
        </div>
        <div class="item tokyo">
          <div class="city_name">Tokyo</div>
          <div class="degs">8&deg;C <img src="./icons/moon_icon.svg" alt="Cool Weather"></div>
        </div>
        <div class="item w-100 sydney">
          <div class="city_name">Sydney</div>
          <div class="degs">25&deg;C <img src="./icons/cloud_sun1_icon.svg" alt="Cloudy Weather"></div>
        </div>
      </div>
      <p>Have a nice day and don't forget an umbrella if you are in New Delhi now!</p>
    </div>
  </div>
</body>
</html>
